services:
  node-red:
    build: .
    container_name: openinc-node-red
    ports:
      - "1880:1880"
    environment:
      # Set all three to authenticate the Node-RED editor against a Parse
      # Server instead of the default admin credentials. Users need an
      # OD3_Permission with key "openware:nodered".
      - OI_PARSE_AUTH_ENABLED=true
      - OI_PARSE_URL=https://parse-demo.apps.openinc.dev/parse
      - OI_PARSE_APPID=openinc-demo
      # Shared bearer token for the openware virtual sensor API (HTTP + WS)
      - OPENWARE_VIRTUAL_SENSORS_TOKEN=secret
      # Turn off bundled open.INC node packages (all ON by default; use
      # 0/false/no/off). Disabled packages are not loaded at all; flows that
      # still use their nodes will not start ("missing node types").
      # OPENSERVICE requires PARSE: disabling PARSE disables OPENSERVICE too,
      # and Node-RED refuses to start if OPENSERVICE is explicitly enabled.
      # - OI_NODES_PARSE=false
      # - OI_NODES_OPENWARE=false
      # - OI_NODES_OPENSERVICE=false
    volumes:
      # Node-RED user dir (flows.json, settings.js, nodes installed via the
      # palette) lives on the host. On first start the entrypoint seeds it
      # with the image defaults. The container runs as uid 1001 / gid 0; on
      # Linux hosts run `sudo chown -R 1001:0 node-red/data` once.
      - ./node-red/data:/data
      # Optional: mount the built packages for live development. Rebuild on
      # the host (pnpm build), then restart the container:
      # - ./packages/node-red-contrib-openware/dist:/opt/node-red/node_modules/@openinc/node-red-contrib-openware/dist
      # - ./packages/node-red-contrib-openinc-parse/dist:/opt/node-red/node_modules/@openinc/node-red-contrib-openinc-parse/dist
    restart: unless-stopped
