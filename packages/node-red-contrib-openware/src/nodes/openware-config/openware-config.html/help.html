<script type="text/html" data-help-name="openware-config">
  <p>Configuration for open.WARE Server</p>
  <h3>Test connection</h3>
  <p>Checks the connection from the Node-RED runtime:</p>
  <ul>
    <li><b>Credentials</b> - logs in with the host, port, user and password entered in the dialog. A saved password is only used for the host and port it was deployed with; enter it again to test a different host.</li>
    <li><b>Session</b> - checks whether open.WARE still accepts the session of the deployed config node.</li>
  </ul>
</script>
